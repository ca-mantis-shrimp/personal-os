# Fork-owned Fedora headless factory links. Existing mutable overrides are not
# replaced (except /etc/mtab's canonical proc link). Updates change /usr/factory,
# not user/account/application state in /etc, /var or /home.
L /etc/os-release - - - - ../usr/lib/os-release
L+ /etc/mtab - - - - ../proc/self/mounts
L /etc/locale.conf
L /etc/nsswitch.conf
L /etc/profile
L /etc/profile.d
L /etc/security
L? /etc/bashrc
L? /etc/bash.bashrc
L? /etc/bash.bash_logout
L? /etc/bash_completion.d
L /etc/environment

# Podman needs its registry/signature policy on the otherwise empty mutable root.
# Copy only on first creation; allow site policy/rootful Quadlets without writing
# immutable /usr or replacing existing container config. Subids stay mutable and
# are allocated by account enrollment, never symlinked to a factory mapping.
C /etc/containers - - - - /usr/share/factory/etc/containers

# Fedora trust/PAM/loader configuration and SSH vendor defaults. Host-specific
# SSH enrollment policy is already staged separately in the profile's factory.
L? /etc/ca-certificates
L? /etc/crypto-policies
L? /etc/pki
L /etc/ssl
L? /etc/authselect
L /etc/ld.so.conf
L /etc/ld.so.conf.d
L /etc/ssh/ssh_config
L /etc/ssh/ssh_config.d
L /etc/ssh/sshd_config
L /etc/ssh/sshd_config.d

L? /etc/man_db.conf
L? /etc/manpath.config
L? /etc/services
L? /etc/nftables.conf
L? /etc/skel
L /etc/default/useradd
L? /etc/alternatives
