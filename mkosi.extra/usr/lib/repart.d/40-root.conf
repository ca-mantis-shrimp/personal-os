[Partition]
Type=root
Format=btrfs
SizeMinBytes=1G
Weight=20000
Subvolumes=/var
# PID 1 needs labeled /, /etc and usr-merge links before target tmpfiles.
# Copy only first-creation metadata; policy remains linked to signed /usr.
CopyFiles=/usr/share/factory/root:/
MakeDirectories=/var/log/journal
Encrypt=tpm2
# Mutable data is not disposable OS state. Recovery is explicit, not a reset.
FactoryReset=no
Label=%M-root
