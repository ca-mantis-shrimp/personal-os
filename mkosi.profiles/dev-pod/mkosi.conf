# Disposable root-agent machine. No services, personal data or durable secrets.
# Remote authenticated controllers execute work here; no agent auto-start/login.
[Assert]
Distribution=arch
Profiles=!mini-server
Profiles=!mini-server-arch

[Build]
CacheDirectory=../../mkosi.cache/dev-pod

[Output]
OutputDirectory=../../mkosi.output/dev-pod

[Content]
# Headless and disposable: no interactive first boot. systemd 262 otherwise
# waits at the console for recovery-key enrollment (initrd) and then for a root
# password (systemd-firstboot). Root access is the SSH key credential.
KernelCommandLine=rd.systemd.mask=systemd-cryptenroll-firstboot.service
KernelCommandLine=systemd.firstboot=no
