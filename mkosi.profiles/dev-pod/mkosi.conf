# Disposable root-agent machine. No services, personal data or durable secrets.
# Agents run here as root with a runtime-only token in /run; no auto-start/login.
[Assert]
Distribution=arch
Profiles=!mini-server
Profiles=!mini-server-arch

[Build]
CacheDirectory=../../mkosi.cache/dev-pod

[Output]
OutputDirectory=../../mkosi.output/dev-pod

[Content]
# Agent harnesses install at run time under /root (npm --prefix), not into the
# signed image; the image carries only their runtime, plus gh and neovim,
# the editor Darrion works in. shpool installs at run time from its release.
# linux-firmware: the dev pod is real hardware (the NUC); without it amdgpu and
# the wifi fail to initialize. tailscale: reach the pod off the LAN like the
# other machines (login state persists in /var/lib/tailscale).
# gcc and rust: core toolchains. Rust repos' pre-push gates (clearhead-core:
# fmt, clippy, tests) run on the host, and tree-sitter crates compile C.
# mkosi: agent-sandbox builds the sandbox base and its layers on the host.
# agent-sandbox's own host files are not here: it ships them as a sysext.
Packages=
        gcc
        github-cli
        linux-firmware
        mkosi
        neovim
        nodejs
        npm
        polkit
        rust
        tailscale
# Headless and disposable: no interactive first boot. systemd 262 otherwise
# waits at the console for recovery-key enrollment (initrd) and then for a root
# password (systemd-firstboot). Root access is the SSH key credential.
KernelCommandLine=rd.systemd.mask=systemd-cryptenroll-firstboot.service
KernelCommandLine=systemd.firstboot=no
