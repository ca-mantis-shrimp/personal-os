[Partition]
Type=home
Format=btrfs
SizeMinBytes=1G
Weight=40000
# Dev pod: the facilitator works from /home, so it is sealed to the TPM like root.
# Mutable data is not disposable OS state. Recovery is explicit, not a reset.
Encrypt=tpm2
FactoryReset=no
Label=%M-home
