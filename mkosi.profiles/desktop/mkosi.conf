# Darrion's desktop (i7-12700K, Intel UHD 770, RTX 3060 Ti): KDE Plasma on Wayland.
# The list is the base and hardware rows of docs/desktop-sort (2026-10-21), minus
# what the shared Arch fragment already installs. Not here yet: the AUR builds
# (1Password from its vendor tarball, agent-sandbox-system, libsane-dsseries) and
# v4l2loopback, whose dkms module needs an image build step.
[Assert]
Distribution=arch
Profiles=!mini-server
Profiles=!mini-server-arch
Profiles=!dev-pod

[Build]
CacheDirectory=../../mkosi.cache/desktop

[Output]
OutputDirectory=../../mkosi.output/desktop

[Content]
Packages=
        # Arch base
        linux-firmware
        logrotate
        man-db
        man-pages
        sudo
        zram-generator
        # Intel CPU and iGPU
        cpupower
        intel-media-driver
        intel-ucode
        libva-intel-driver
        turbostat
        vulkan-intel
        # KDE Plasma
