# The Quieter (MeLE Quieter 4C: Intel N150, 8 GB soldered RAM, 128 GB eMMC, WiFi 5,
# BT 5.1): Darrion's modular client, the Duet's replacement. KDE Plasma on Wayland
# comes from the shared kde profile, which scripts/mkosi-arch adds. The hardware rows
# are from the listing; check them against the machine (=quieter-inventory) before
# the first install. Start small and add what breaks (Darrion, 2026-11-24).
[Assert]
Distribution=arch
Profiles=!mini-server
Profiles=!mini-server-arch
Profiles=!dev-pod
Profiles=!desktop

[Build]
CacheDirectory=../../mkosi.cache/quieter

[Output]
OutputDirectory=../../mkosi.output/quieter

[Content]
Packages=
        # Arch base
        linux-firmware
        logrotate
        sudo
        zram-generator
        # Intel CPU and iGPU (N150: Alder Lake-N graphics, the iHD media driver)
        intel-media-driver
        intel-ucode
        vulkan-intel
        # networking
        iwd
        tailscale
        # power
        power-profiles-daemon
        # shell and terminal, for the dotfiles
        fish
        ghostty
        kitty
        starship
        zoxide
        # editor
        neovim
        # version control
        chezmoi
        github-cli
