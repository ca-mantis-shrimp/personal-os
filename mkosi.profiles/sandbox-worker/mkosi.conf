# Non-bootable base tree for agent sandboxes: a session runs on it as a systemd
# unit's RootDirectory=, and layers built on it (mkosi BaseTrees= with Overlay=)
# stack on top. No kernel, boot chain, services or OS policy; only what agents
# work with. Images are this repo's job (meta-analysis DECISIONS).
[Assert]
Distribution=arch
Profiles=!mini-server
Profiles=!mini-server-arch
Profiles=!dev-pod

[Build]
CacheDirectory=../../mkosi.cache/sandbox-worker

[Output]
OutputDirectory=../../mkosi.output/sandbox-worker
Format=directory
SplitArtifacts=

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Content]
Bootable=no
# Keep pacman's database although pacman isn't installed: a layer built on this
# tree (mkosi BaseTrees=) installs its packages against it.
CleanPackageMetadata=no
KernelCommandLine=
ExtraTrees=
PostInstallationScripts=
FinalizeScripts=
Packages=
Packages=
        bash
        ca-certificates
        coreutils
        curl
        diffutils
        fd
        file
        findutils
        gawk
        git
        grep
        gzip
        jq
        less
        nodejs
        npm
        patch
        procps-ng
        python
        ripgrep
        sed
        shadow
        tar
        which
        xz
