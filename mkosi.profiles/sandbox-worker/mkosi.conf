# Non-bootable OCI base for agent sandboxes: agent-sandbox runs sessions on it and
# projects extend it (FROM ${BASE}). No kernel, boot chain, services or OS policy;
# only what agents work with. pacman stays so a project's Containerfile can add its
# own layer. Images are this repo's job (meta-analysis DECISIONS).
[Assert]
Distribution=arch
Profiles=!mini-server
Profiles=!mini-server-arch
Profiles=!dev-pod

[Build]
CacheDirectory=../../mkosi.cache/sandbox-worker

[Output]
OutputDirectory=../../mkosi.output/sandbox-worker
Format=oci
SplitArtifacts=

[Content]
Bootable=no
SecureBoot=no
SignExpectedPcr=no
WithDocs=no
KernelCommandLine=
ExtraTrees=
PostInstallationScripts=
PostInstallationScripts=pacman-in-containers.chroot
FinalizeScripts=
Packages=
Packages=
        archlinux-keyring
        bash
        ca-certificates
        coreutils
        curl
        diffutils
        fd
        file
        findutils
        gawk
        git
        grep
        gzip
        jq
        less
        nodejs
        npm
        pacman
        patch
        procps-ng
        python
        ripgrep
        sed
        shadow
        tar
        which
        xz
