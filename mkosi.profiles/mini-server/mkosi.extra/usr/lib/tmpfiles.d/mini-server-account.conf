# Workload readiness is runtime-only, cleared by reboot. Enrollment does NOT
# create a ready file. Service configuration/readiness remains unimplemented.
d /run/personal-os 0755 root root -

# Copy factory defaults only when absent; preserve mutable local overrides.
C /etc/login.defs - root root - /usr/share/factory/etc/login.defs
C /etc/sudoers 0440 root root - /usr/share/factory/etc/sudoers
C /etc/sudoers.d 0750 root root - /usr/share/factory/etc/sudoers.d
