# Initial server overlay; not a complete deployable profile.
# Upstream root/home/homed/signing behavior remains to be explicitly reviewed.
# This does not stage/apply dotfiles yet; integration is tracked in the charter.
[Distribution]
Distribution=fedora
Release=44

[Content]
Hostname=mini-travel-server
Packages=
        chezmoi
        openssh-server
        sudo
        fish
        neovim
        syncthing
        radicale3
        radicale3-selinux
        python3-bcrypt
        vdirsyncer
        httpd-tools
        restic
        mdadm
        smartmontools
        selinux-policy-targeted
        policycoreutils

# Tailscale repo, Collector and ClearHead release artifacts still need explicit,
# pinned provisioning. No credentials or production device identities belong here.
