# Fork-owned headless server workload/account overlay; not deployable yet.
# TPM-encrypted Btrfs root/swap, unencrypted home and signing/recovery need validation.
# Conventional account enrollment is target-only and still needs booted testing.
# Committed dotfiles are staged by mkosi.finalize; target apply/controller are
# prototypes. Automatic configuration remains disabled pending runtime gates.
[Distribution]
Distribution=fedora
Release=44

[Content]
# Actual hostname is supplied in the host-specific runtime account credential.
Hostname=
Packages=
        chezmoi
        openssh-server
        sudo
        shadow-utils
        # Core workload runtime; do not depend on weak/recommended rootless bits.
        podman
        container-selinux
        shadow-utils-subid
        crun
        netavark
        passt
        fuse-overlayfs
        fish
        neovim
        # Interactive agent tooling/support; installed in the image, never hooks.
        nodejs
        npm
        git-core
        ripgrep
        fd-find
        tmux
        syncthing
        radicale3
        radicale3-selinux
        python3-bcrypt
        vdirsyncer
        httpd-tools
        restic
        mdadm
        smartmontools
        selinux-policy-targeted
        policycoreutils

# Only build overlay gets Cargo/compilers; npm also supports user/project tooling.
# No target-side bootstrap installing OS packages.
BuildPackages=
        cargo
        rust
        gcc
        pkgconf-pkg-config
        openssl-devel

[Build]
# Exact public agent/prompt releases + integrity-locked npm/Cargo dependencies.
# Fedora 44 has no starship RPM; the hook builds its pinned source, like shpool.
WithNetwork=yes

[Runtime]
# No image/demo enrollment inputs. Tests/installations supply isolated credentials.
Credentials=

# Tailscale repo, Collector and ClearHead release artifacts still need explicit,
# pinned provisioning. No credentials or production device identities belong here.
