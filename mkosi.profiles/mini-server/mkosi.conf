# Initial server overlay; not a complete deployable profile.
# Upstream root/home/signing behavior remains to be explicitly reviewed.
# Conventional account enrollment is target-only and still needs booted testing.
# Committed dotfiles are staged by mkosi.finalize; target apply is not implemented.
[Distribution]
Distribution=fedora
Release=44

[Content]
# Actual hostname is supplied in the host-specific runtime account credential.
Hostname=
Packages=
        chezmoi
        openssh-server
        sudo
        shadow-utils
        fish
        neovim
        syncthing
        radicale3
        radicale3-selinux
        python3-bcrypt
        vdirsyncer
        httpd-tools
        restic
        mdadm
        smartmontools
        selinux-policy-targeted
        policycoreutils

[Runtime]
# Reset upstream demo passwords, autologin and homed-user VM credentials.
# Tests/installations must supply their own isolated runtime credentials.
Credentials=

# Tailscale repo, Collector and ClearHead release artifacts still need explicit,
# pinned provisioning. No credentials or production device identities belong here.
