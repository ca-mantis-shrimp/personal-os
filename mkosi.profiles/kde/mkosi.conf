# Shared graphical layer: KDE Plasma on Wayland, for every machine with a screen.
# scripts/mkosi-arch adds it to the desktop and quieter roles; it sets no output
# or cache of its own, so it never builds alone. Moved unchanged from the desktop
# profile (2026-11-24, Darrion: "try the shared profile and see where things break").
[Assert]
Distribution=arch
Profiles=!mini-server
Profiles=!mini-server-arch
Profiles=!dev-pod
Profiles=!sandbox-worker

[Content]
Packages=
        # KDE Plasma
        aurorae
        bluedevil
        breeze
        breeze-gtk
        breeze-plymouth
        discover
        drkonqi
        flatpak-kcm
        kactivitymanagerd
        kde-cli-tools
        kde-gtk-config
        kdeconnect
        kdecoration
        kdeplasma-addons
        kdialog
        kglobalacceld
        kgraphviewer
        khal
        khard
        kinfocenter
        kmenuedit
        knighttime
        kpipewire
        krdp
        kscreen
        kscreenlocker
        ksshaskpass
        ksystemstats
        kwallet-pam
        kwayland
        kwin
        kwrited
        libkeyfinder
        libkscreen
        libksysguard
        libplasma
        milou
        ocean-sound-theme
        oxygen
        oxygen-sounds
        plasma-activities
        plasma-activities-stats
        plasma-browser-integration
        plasma-desktop
        plasma-disks
        plasma-firewall
        plasma-integration
        plasma-keyboard
        plasma-nm
        plasma-pa
        plasma-sdk
        plasma-systemmonitor
        plasma-thunderbolt
        plasma-vault
        plasma-welcome
        plasma-workspace
        plasma-workspace-wallpapers
        plasma5support
        plymouth-kcm
        polkit-kde-agent
        powerdevil
        qqc2-breeze-style
        qt6-tools
        sddm-kcm
        spectacle
        systemsettings
        xdg-desktop-portal-kde
        # Wayland common
        layer-shell-qt
        qt5-wayland
        qt6-wayland
        sddm
        vulkan-mesa-layers
        vulkan-validation-layers
        wl-clipboard
        xdg-desktop-portal-gtk
        # audio
        gst-libav
        gst-plugin-pipewire
        gst-plugins-bad
        gst-plugins-good
        # bluetooth
        bluetui
        bluez
        # fonts
        adobe-source-code-pro-fonts
        noto-fonts
        noto-fonts-cjk
        noto-fonts-emoji
        noto-fonts-extra
        ttf-nerd-fonts-symbols
