[Config]
MinimumVersion=27.1
# The matching Fedora fragment selects its retained mini-server profile.
# scripts/mkosi-arch selects Arch before fragment discovery, then one role.

# Select the distro before conditional fragments are loaded. Selecting it only
# in a late profile can otherwise retain the builder host's Arch fragments.
[Distribution]
Distribution=fedora

[Build]
ToolsTree=default
# Keep builder tools on the same reviewed Fedora release; no graphical VM stack.
ToolsTreeDistribution=fedora
ToolsTreeRelease=44
ToolsTreeProfiles=misc,runtime
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Output]
OutputDirectory=mkosi.output
SplitArtifacts=uki,partitions
Format=disk
# Ten characters keeps timestamp-versioned GPT verity-signature labels <=36.
ImageId=PersonalOS
ManifestFormat=json
Output=%i_%v_%a

[Content]
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        audit=1
        selinux=1
        enforcing=1
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
        systemd.image_filter=usr=PersonalOS_*:usr-verity=PersonalOS_*:usr-verity-sig=PersonalOS_*:root=PersonalOS-*:swap=PersonalOS-*:home=PersonalOS-*
InitrdProfiles=
KernelInitrdModules=default
# Identity and console access are runtime enrollment inputs, never image defaults.
Hostname=
WithRecommends=no
# A failed relabel is a build failure, not an ignored warning.
SELinuxRelabel=yes

# Headless OS, partition/recovery tools and basic operator diagnostics.
# Workloads, account/configuration tooling and agent CLIs belong to mini-server.
Packages=
        acl
        attr
        bash-completion
        btrfs-progs
        ca-certificates
        coreutils
        cpio
        curl
        dbus-broker
        diffutils
        dosfstools
        e2fsprogs
        efibootmgr
        erofs-utils
        file
        findutils
        gdisk
        grep
        gzip
        jq
        kbd
        kmod
        less
        nftables
        nvme-cli
        openssl
        pciutils
        sed
        strace
        systemd
        tar
        udev
        unzip
        usbutils
        util-linux
        which
        xz
        zstd

VolatilePackages=
        systemd
        udev

InitrdVolatilePackages=
        systemd
        udev

[Validation]
SecureBoot=yes
# Signing remains required, but enrollment is a separate reviewed operation.
SecureBootAutoEnroll=no
SignExpectedPcr=yes

[Runtime]
RuntimeSize=30G
RAM=4G
CPUs=4
Ephemeral=yes
# Fresh isolated tests/installations must supply their own runtime credentials.
Credentials=
