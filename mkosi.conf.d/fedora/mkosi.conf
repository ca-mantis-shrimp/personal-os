[Match]
Distribution=fedora

[Distribution]
# Deliberate stable base for this fork; upgrades need review and VM validation.
Release=44

[Content]
InitrdPackages=
        libfdisk

# Fedora boot/network/PAM plumbing and recovery/query tools. Runtime package
# installation is not supported; dnf stays in mkosi's disposable tools tree.
Packages=
        cryptsetup
        distribution-gpg-keys
        fedora-release
        hostname
        iproute
        iputils
        kernel-core
        man-db
        man-pages
        openssh-clients
        pam
        passwd
        procps-ng
        python3
        rpm
        sbsigntools
        systemd-boot
        systemd-container
        systemd-networkd
        systemd-networkd-defaults
        systemd-oomd-defaults
        systemd-pam
        systemd-resolved
        systemd-ukify
        tpm2-tools
        tpm2-tss
        util-linux-core
        veritysetup
        vim-minimal
        zram-generator-defaults

VolatilePackages=
        systemd-boot
        systemd-container
        systemd-networkd
        systemd-networkd-defaults
        systemd-oomd-defaults
        systemd-pam
        systemd-resolved
        systemd-ukify
