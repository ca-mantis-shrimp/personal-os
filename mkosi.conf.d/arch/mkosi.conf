# Shared headless Arch foundation. Roles are independent mkosi profiles.
[Match]
Distribution=arch

[Distribution]
Release=rolling
# Reviewed dated archive; change deliberately with a new manifest/VM pass.
Snapshot=2026/10/04

[Build]
ToolsTreeDistribution=arch
ToolsTreeRelease=rolling
ToolsTreeSnapshot=2026/10/04
# Resolve misc's virtual 'man' deliberately, rather than choosing an alternative
# implicitly in pacman's noninteractive transaction. Target remains unaffected.
ToolsTreePackages=man-db
# Share the base misc/runtime tools profiles, without a graphical VM stack.
CacheDirectory=../../mkosi.cache/arch

[Output]
OutputDirectory=../../mkosi.output/arch

[Content]
# This is a distinct non-SELinux architecture, not a relaxed Fedora test.
SELinuxRelabel=no
BuildScripts=
BuildPackages=
KernelCommandLine=
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=encrypted+unprotected+absent:=ignore
        systemd.image_filter=usr=PersonalOS_*:usr-verity=PersonalOS_*:usr-verity-sig=PersonalOS_*:root=PersonalOS-*:swap=PersonalOS-*:home=PersonalOS-*
# Explicit list: no Fedora package names, no broad Arch base metapackage/AUR/OBS.
Packages=
Packages=
        acl
        archlinux-keyring
        attr
        bash
        bash-completion
        btrfs-progs
        ca-certificates
        coreutils
        cpio
        cryptsetup
        crun
        curl
        dbus-broker-units
        diffutils
        dosfstools
        e2fsprogs
        efibootmgr
        erofs-utils
        fd
        file
        findutils
        fuse-overlayfs
        git
        gptfdisk
        grep
        gzip
        iproute2
        iputils
        jq
        kbd
        kmod
        less
        linux
        netavark
        nftables
        nvme-cli
        openssh
        openssl
        pacman
        passt
        pciutils
        podman
        procps-ng
        python
        ripgrep
        sbsigntools
        sed
        shadow
        strace
        systemd
        systemd-ukify
        tar
        tmux
        tpm2-tools
        tpm2-tss
        unzip
        usbutils
        util-linux
        which
        xz
        zstd
VolatilePackages=
VolatilePackages=
        systemd
        systemd-ukify
InitrdVolatilePackages=
InitrdVolatilePackages=
        systemd
        systemd-ukify
